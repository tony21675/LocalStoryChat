base_model: Qwen/Qwen3.5-9B-Base
processor_type: AutoProcessor

# Text-only writer training. Keep the multimodal portion frozen.
freeze_mm_modules: true

# Qwen3.5 text training uses the processor/chat-template path.
skip_prepare_dataset: true
remove_unused_columns: false
sample_packing: false

chat_template: qwen3_5
chat_template_kwargs:
  enable_thinking: false

datasets:
  - path: ./training/gold_dataset.jsonl
    type: chat_template
    field_messages: messages
    roles_to_train:
      - assistant
    split: train

dataset_prepared_path: ./training/cache/gold_qwen3_5_9b
val_set_size: 0.1

output_dir: ./training/outputs/qwen3_5_9b_writer_kaggle

# T4 has 16 GB VRAM. Keep the first pass conservative.
sequence_len: 2048
pad_to_sequence_len: false

load_in_4bit: true
adapter: qlora

lora_r: 16
lora_alpha: 32
lora_dropout: 0.05

# Standard attention/MLP projections plus Qwen3.5 GatedDeltaNet projections.
lora_target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - down_proj
  - up_proj
  - linear_attn.in_proj_qkv
  - linear_attn.in_proj_z
  - linear_attn.out_proj

micro_batch_size: 1
gradient_accumulation_steps: 8

num_epochs: 3
optimizer: adamw_bnb_8bit
lr_scheduler: cosine
learning_rate: 0.0001

# NVIDIA T4 is Turing, so use FP16 rather than BF16.
fp16: true
bf16: false
tf32: false

gradient_checkpointing: true
gradient_checkpointing_kwargs:
  use_reentrant: false

logging_steps: 1
# Flash Attention 2 requires newer NVIDIA architectures. Use PyTorch SDPA.
attn_implementation: sdpa

warmup_ratio: 0.1
evals_per_epoch: 2
saves_per_epoch: 1
weight_decay: 0.0

wandb_project:
wandb_entity:
wandb_watch:
wandb_name:
wandb_log_model:

resume_from_checkpoint:
